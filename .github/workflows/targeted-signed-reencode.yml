name: Targeted signed RuleSpec re-encode
run-name: "Targeted signed RuleSpec re-encode [${{ inputs.queue_id || 'adhoc' }}:${{ inputs.queue_item_id || 'adhoc' }}:${{ inputs.queue_item_generation_sha256 || 'adhoc' }}] ${{ inputs.citation }}"

on:
  workflow_dispatch:
    inputs:
      citation:
        description: Canonical corpus citation path
        required: true
        type: string
      country:
        description: Canonical RuleSpec country checkout (for rulespec-<country>)
        required: true
        default: us
        type: string
      rulespec_ref:
        description: Immutable main SHA, or allowlisted reviewed SHA (artifact-only unless its approved PR base is exact)
        required: true
        type: string
      pr_base_branch:
        description: Exact RuleSpec branch targeted when open_pr is true
        required: false
        default: main
        type: string
      corpus_ref:
        description: Immutable axiom-corpus commit SHA
        required: true
        type: string
      rules_engine_ref:
        description: Immutable axiom-rules-engine commit SHA
        required: true
        type: string
      review_finding:
        description: Validator or independent-review finding to address
        required: false
        type: string
      source_bundle_json:
        description: JSON array of additional same-jurisdiction citations to encode as signed atomic imports
        required: false
        default: "[]"
        type: string
      replace_rulespec_path:
        description: Existing target, or unique canonical destination for a legacy replacement
        required: false
        type: string
      replace_legacy_rulespec_path:
        description: Exact noncanonical legacy primary replaced by a fresh model encode
        required: false
        type: string
      legacy_exact_dependent_rulespec_path:
        description: Exact v1/manual direct dependent migrated by canonical reference rewrite
        required: false
        type: string
      second_legacy_exact_dependent_rulespec_path:
        description: Second exact v1/manual direct dependent in the same atomic migration
        required: false
        type: string
      dependent_citation:
        description: Direct dependent to re-encode atomically after a breaking target
        required: false
        type: string
      dependent_review_finding:
        description: Independent-review finding for the direct dependent
        required: false
        type: string
      second_dependent_citation:
        description: Second direct dependent to re-encode in the same signed change
        required: false
        type: string
      second_dependent_review_finding:
        description: Independent-review finding for the second direct dependent
        required: false
        type: string
      open_pr:
        description: Commit, push, and open a draft RuleSpec pull request
        required: false
        default: false
        type: boolean
      queue_id:
        description: Optional durable encoding queue identifier
        required: false
        type: string
      queue_item_id:
        description: Optional durable encoding queue item identifier
        required: false
        type: string
      queue_manifest_sha256:
        description: Optional SHA-256 of the durable queue manifest
        required: false
        type: string
      queue_item_generation_sha256:
        description: Optional stable SHA-256 identity of the queue item attempt
        required: false
        type: string
      queue_dispatcher_run_id:
        description: Dispatcher run that authorized this queue-target workflow run
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: targeted-signed-reencode-${{ github.actor == 'github-actions[bot]' && inputs.queue_id && inputs.queue_item_generation_sha256 || github.run_id }}
  cancel-in-progress: false

jobs:
  encode:
    name: Queue protected signed RuleSpec re-encode
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && (
          inputs.queue_id == ''
          || (
            github.actor == 'github-actions[bot]'
            && github.run_attempt == 1
          )
        )
      }}
    environment: production-signing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout axiom-encode
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: axiom-encode
          fetch-depth: 0
          persist-credentials: false

      - name: Validate country routing input
        env:
          CITATION: ${{ inputs.citation }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          COUNTRY: ${{ inputs.country }}
          OPEN_PR: ${{ inputs.open_pr }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_DISPATCHER_RUN_ID: ${{ inputs.queue_dispatcher_run_id }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-country "$COUNTRY"
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-queue-tracking "$QUEUE_ID" "$QUEUE_ITEM_ID" \
            "$QUEUE_MANIFEST_SHA256" "$QUEUE_ITEM_GENERATION_SHA256"
          if [ -n "$QUEUE_ID" ]; then
            if [ "$GITHUB_ACTOR" != "github-actions[bot]" ] || \
              [ "$GITHUB_RUN_ATTEMPT" != "1" ] || \
              [[ ! "$QUEUE_DISPATCHER_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "queue target must be created by an authenticated dispatcher" >&2
              exit 1
            fi
            python axiom-encode/scripts/prepare_signed_queue.py \
              validate-dispatch \
              "axiom-encode/data/encoding-queues/${QUEUE_ID}.json" \
              --queue-id "$QUEUE_ID" \
              --item-id "$QUEUE_ITEM_ID" \
              --manifest-sha256 "$QUEUE_MANIFEST_SHA256" \
              --item-generation-sha256 "$QUEUE_ITEM_GENERATION_SHA256" \
              --citation "$CITATION" \
              --country "$COUNTRY" \
              --rulespec-ref "$RULESPEC_REF" \
              --pr-base-branch "$PR_BASE_BRANCH" \
              --corpus-ref "$CORPUS_REF" \
              --rules-engine-ref "$RULES_ENGINE_REF" \
              --open-pr "$OPEN_PR"

            api_version="2026-03-10"
            dispatcher_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID"
            for _ in $(seq 1 60); do
              gh api \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID" \
                > "$RUNNER_TEMP/queue-dispatcher-run.json"
              if jq -e '.status == "completed"' \
                "$RUNNER_TEMP/queue-dispatcher-run.json" > /dev/null; then
                break
              fi
              sleep 2
            done
            jq -e \
              --arg head_sha "$GITHUB_SHA" \
              --arg url "$dispatcher_run_url" '
                .status == "completed"
                and .conclusion == "success"
                and .event == "workflow_dispatch"
                and .head_branch == "main"
                and .head_sha == $head_sha
                and (.run_attempt | type) == "number"
                and .run_attempt >= 1
                and .html_url == $url
                and .path == ".github/workflows/dispatch-signed-snap-queue.yml"
              ' "$RUNNER_TEMP/queue-dispatcher-run.json" > /dev/null
            gh api --paginate --slurp \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/queue-dispatcher-jobs.json"
            dispatcher_attempts="$(jq -r '.run_attempt' \
              "$RUNNER_TEMP/queue-dispatcher-run.json")"
            jq -e --argjson attempts "$dispatcher_attempts" '
              [.[].jobs[] | select(.name == "Dispatch protected SNAP queue")] as $jobs
              | ($jobs | length) == $attempts
              and ([range(1; $attempts + 1)] ==
                ([$jobs[].run_attempt] | sort))
              and all(
                $jobs[];
                if .run_attempt == 1
                then .status == "completed" and .conclusion == "success"
                else .status == "completed" and .conclusion == "skipped"
                end
              )
            ' "$RUNNER_TEMP/queue-dispatcher-jobs.json" > /dev/null
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_DISPATCHER_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/queue-dispatcher-artifacts.json"
            archive_url="$(jq -er \
              --arg name "snap-queue-reconciliation-$QUEUE_DISPATCHER_RUN_ID" '
                [
                  .artifacts[]
                  | select(.name == $name and .expired == false)
                  | .archive_download_url
                ]
                | if length == 1 then .[0] else error("dispatcher artifact is unavailable") end
              ' "$RUNNER_TEMP/queue-dispatcher-artifacts.json")"
            gh api "$archive_url" > "$RUNNER_TEMP/queue-dispatcher.zip"
            mkdir "$RUNNER_TEMP/queue-dispatcher"
            unzip -q "$RUNNER_TEMP/queue-dispatcher.zip" \
              -d "$RUNNER_TEMP/queue-dispatcher"
            jq -e \
              --arg generation "$QUEUE_ITEM_GENERATION_SHA256" \
              --arg item_id "$QUEUE_ITEM_ID" \
              --arg manifest "$QUEUE_MANIFEST_SHA256" '
                .manifest_sha256 == $manifest
                and any(
                  .items[];
                  .id == $item_id
                  and .generation_sha256 == $generation
                  and .action == "dispatch"
                )
              ' "$RUNNER_TEMP/queue-dispatcher/snap-queue-plan.json" > /dev/null
            jq -e \
              --arg item_id "$QUEUE_ITEM_ID" \
              --arg run_id "$GITHUB_RUN_ID" '
                select(
                  .item_id == $item_id
                  and .workflow_run_attempt == 1
                  and .workflow_run_id == $run_id
                )
              ' "$RUNNER_TEMP/queue-dispatcher/dispatched-run-records.jsonl" \
              > /dev/null
          fi

      - name: Checkout canonical RuleSpec country
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/rulespec-${{ inputs.country }}
          ref: ${{ inputs.rulespec_ref }}
          path: rulespec-${{ inputs.country }}
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Checkout axiom-corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-corpus
          ref: ${{ inputs.corpus_ref }}
          path: axiom-corpus
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ inputs.rules_engine_ref }}
          path: axiom-rules-engine
          fetch-depth: 0
          token: ${{ secrets.AXIOM_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Verify immutable checkout identities
        env:
          COUNTRY: ${{ inputs.country }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          OPEN_PR: ${{ inputs.open_pr }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
          RULES_ENGINE_REF: ${{ inputs.rules_engine_ref }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          verify_checkout() {
            local label="$1"
            local requested="$2"
            local checkout="$3"
            if [[ ! "$requested" =~ $sha_pattern ]]; then
              echo "$label ref must be a full lowercase commit SHA" >&2
              exit 1
            fi
            actual="$(git -C "$checkout" rev-parse HEAD)"
            if [ "$actual" != "$requested" ]; then
              echo "$label checkout resolved to $actual, expected $requested" >&2
              exit 1
            fi
          }
          if [[ ! "$GITHUB_SHA" =~ $sha_pattern ]]; then
            echo "GITHUB_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git -C axiom-encode rev-parse HEAD)" = "$GITHUB_SHA"
          verify_checkout "rulespec-$COUNTRY" "$RULESPEC_REF" "$RULESPEC_CHECKOUT"
          verify_checkout axiom-corpus "$CORPUS_REF" axiom-corpus
          verify_checkout axiom-rules-engine "$RULES_ENGINE_REF" axiom-rules-engine
          test "$(git -C "$RULESPEC_CHECKOUT" remote get-url origin)" = \
            "https://github.com/TheAxiomFoundation/rulespec-$COUNTRY"
          python axiom-encode/scripts/prepare_signed_backfill.py \
            validate-rulespec-base "$RULESPEC_CHECKOUT" "$COUNTRY" \
            "$RULESPEC_REF" "$OPEN_PR" "$PR_BASE_BRANCH"
          git -C axiom-corpus merge-base --is-ancestor HEAD refs/remotes/origin/main
          git -C axiom-rules-engine merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: Set up Go 1.26.1
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.1
          cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build Axiom rules engine
        working-directory: axiom-rules-engine
        run: |
          cargo build --release --locked
          test -x target/release/axiom-rules-engine

      - name: Install encoder
        working-directory: axiom-encode
        run: |
          uv sync --locked --python 3.13 --extra api
          rm -rf "$RUNNER_TEMP/axiom-verification-site-packages"
          uv pip install --python .venv/bin/python \
            --target "$RUNNER_TEMP/axiom-verification-site-packages" ".[api]"

      - name: Validate atomic source bundle
        env:
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          QUEUE_ID: ${{ inputs.queue_id }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SOURCE_BUNDLE_JSON: ${{ inputs.source_bundle_json }}
        run: |
          set -euo pipefail
          source_bundle_args=(
            axiom-encode/.venv/bin/python
            axiom-encode/scripts/prepare_signed_backfill.py
            parse-source-bundle "${SOURCE_BUNDLE_JSON:-[]}"
            --primary-citation "$CITATION"
          )
          if [ -n "$DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          normalized_source_bundle="$("${source_bundle_args[@]}")"
          if [ -n "$QUEUE_ID" ] && [ "$normalized_source_bundle" != "[]" ]; then
            echo "queue-authorized re-encodes cannot add a source bundle until queue generation identity binds it" >&2
            exit 1
          fi

      - name: Fetch pinned signed corpus release object
        shell: bash
        env:
          SUPABASE_URL: https://swocpijqqahhuwtuahwc.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          materializer=axiom-encode/scripts/materialize_corpus_release.py
          toolchain="$RULESPEC_CHECKOUT/.axiom/toolchain.toml"
          mapfile -t release_pin < <(
            axiom-encode/.venv/bin/python "$materializer" pin --toolchain "$toolchain"
          )
          if [ "${#release_pin[@]}" -ne 2 ]; then
            echo "RuleSpec toolchain did not yield exactly one corpus release pin" >&2
            exit 1
          fi
          release_name="${release_pin[0]}"
          release_sha="${release_pin[1]}"
          if [ -n "$QUEUE_ID" ]; then
            axiom-encode/.venv/bin/python \
              axiom-encode/scripts/prepare_signed_queue.py \
              validate-release-pin \
              "axiom-encode/data/encoding-queues/${QUEUE_ID}.json" \
              --toolchain "$toolchain" \
              --manifest-sha256 "$QUEUE_MANIFEST_SHA256"
          fi
          response="$(mktemp "$RUNNER_TEMP/corpus-release-response.XXXXXX")"
          trap 'rm -f "$response"' EXIT
          url="${SUPABASE_URL%/}/rest/v1/release_objects?select=release_object&release_name=eq.${release_name}&content_sha256=eq.${release_sha}&limit=2"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 16777216 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Accept-Profile: corpus" \
            --output "$response" "$url"
          release_commit="$(axiom-encode/.venv/bin/python "$materializer" \
            materialize --toolchain "$toolchain" --response "$response" \
            --corpus-root axiom-corpus)"
          rm -f "$response"
          trap - EXIT
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Signed release provenance is not a full lowercase commit SHA" >&2
            exit 1
          fi
          git -C axiom-corpus merge-base --is-ancestor "$release_commit" HEAD || {
            echo "Pinned corpus checkout predates signed release provenance" >&2
            exit 1
          }

      - name: Provision protected signing supervisor
        working-directory: axiom-encode
        env:
          TRUST_APPLY_ROOT: ${{ vars.AXIOM_ENCODE_APPLY_SIGNING_PUBLIC_KEY }}
          TRUST_EVAL_ROOT: ${{ vars.AXIOM_ENCODE_EVAL_SIGNING_PUBLIC_KEY }}
          TRUST_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
          TRUST_RETIRED_CORPUS_RELEASE_ROOT: ${{ vars.AXIOM_CORPUS_RELEASE_RETIRED_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            ./cmd/axiom-encode-signing-supervisor
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-buildid=' \
            -o "$RUNNER_TEMP/axiom-encode-apply-signer" \
            ./cmd/axiom-encode-apply-signer
          sudo chown 0:0 /opt
          sudo chmod go-w /opt
          sudo rm -rf /opt/axiom-verification
          sudo .venv/bin/python scripts/provision_verification_supervisor.py \
            --destination /opt/axiom-verification \
            --supervisor "$RUNNER_TEMP/axiom-encode-signing-supervisor" \
            --site-packages "$RUNNER_TEMP/axiom-verification-site-packages" \
            --apply-root "$TRUST_APPLY_ROOT" \
            --eval-root "$TRUST_EVAL_ROOT" \
            --corpus-release-root "$TRUST_CORPUS_RELEASE_ROOT" \
            --retired-corpus-release-root "$TRUST_RETIRED_CORPUS_RELEASE_ROOT" \
            --git /usr/bin/git \
            --encoder-git-root "$GITHUB_WORKSPACE/axiom-encode" \
            --encoder-commit "$GITHUB_SHA" \
            --encoder-origin-repository github.com/TheAxiomFoundation/axiom-encode
          sudo install -o root -g root -m 0755 \
            "$RUNNER_TEMP/axiom-encode-apply-signer" \
            /opt/axiom-verification/axiom-encode-apply-signer
          sudo chown -R 0:0 /opt/axiom-verification
          sudo chmod -R go-w /opt/axiom-verification

      - name: Verify protected RuleSpec routing
        env:
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          trusted_path=/opt/axiom-verification/python/bin
          trusted_home=/opt/axiom-verification/python
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            git -C "$RULESPEC_CHECKOUT" rev-parse --show-toplevel
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            git -C "$RULESPEC_CHECKOUT" remote get-url origin
          interpreter="$(sed -n '1s/^#!\([^ ]*\).*/\1/p' \
            /opt/axiom-verification/axiom-encode)"
          env -i PATH="$trusted_path" HOME="$trusted_home" \
            "$interpreter" -I - "$RULESPEC_CHECKOUT" <<'PY'
          import ctypes
          import json
          import sys
          from pathlib import Path

          from axiom_encode.constants import RULESPEC_FILESYSTEM_ROOTS
          from axiom_encode.repo_routing import (
              canonical_rulespec_repo_name,
              inspect_canonical_rulespec_checkout,
          )
          from axiom_encode.signing_broker import _harden_signing_capability_process

          checkout = Path(sys.argv[1])
          structure = {
              "git_marker_is_symlink": (checkout / ".git").is_symlink(),
              "name": checkout.name,
              "path": str(checkout),
              "resolved_path": str(checkout.resolve()),
              "unexpected_root_entries": sorted(
                  name
                  for name in RULESPEC_FILESYSTEM_ROOTS - {"programs"}
                  if (checkout / name).exists() or (checkout / name).is_symlink()
              ),
          }

          def route_payload():
              inspection = inspect_canonical_rulespec_checkout(
                  checkout, allow_composition_specs=True
              )
              return {
                  "canonical_repo_name": canonical_rulespec_repo_name(checkout),
                  "rejection": inspection.rejection,
              }

          direct = route_payload()
          _harden_signing_capability_process(role="routing-probe")
          if sys.platform.startswith("linux"):
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(38, 1, 0, 0, 0) != 0:
                  raise SystemExit("could not enable routing-probe no-new-privileges")
          hardened = route_payload()
          payload = {**structure, "direct": direct, "hardened": hardened}
          print(json.dumps(payload, sort_keys=True))
          if direct["canonical_repo_name"] != checkout.name:
              raise SystemExit("protected RuleSpec routing rejected checkout")
          if hardened["canonical_repo_name"] != checkout.name:
              raise SystemExit("hardened RuleSpec routing rejected checkout")
          PY

      - name: Validate dependent cascade
        if: >-
          ${{
            inputs.dependent_citation != ''
            || inputs.second_dependent_citation != ''
          }}
        env:
          CITATION: ${{ inputs.citation }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          if [ -z "$DEPENDENT_CITATION" ]; then
            echo "first dependent citation is required before a second dependent" >&2
            exit 1
          fi
          dependent_citations=("$DEPENDENT_CITATION")
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            dependent_citations+=("$SECOND_DEPENDENT_CITATION")
          fi
          cascade_args=(
            axiom-encode/.venv/bin/python
            axiom-encode/scripts/prepare_signed_backfill.py
            validate-dependent-cascade
            "$RULESPEC_CHECKOUT" "$CITATION"
          )
          cascade_target="$REPLACE_RULESPEC_PATH"
          if [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            cascade_target="$REPLACE_LEGACY_RULESPEC_PATH"
          fi
          if [ -n "$cascade_target" ]; then
            cascade_args+=(--target-rulespec-path "$cascade_target")
          fi
          cascade_args+=("${dependent_citations[@]}")
          "${cascade_args[@]}"

      - name: Encode, review, validate, and apply
        env:
          AXIOM_ENCODE_APPLY_SIGNING_KEY: ${{ secrets.AXIOM_ENCODE_APPLY_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CITATION: ${{ inputs.citation }}
          REVIEW_FINDING: ${{ inputs.review_finding }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          QUEUE_ID: ${{ inputs.queue_id }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          DEPENDENT_REVIEW_FINDING: ${{ inputs.dependent_review_finding }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_DEPENDENT_REVIEW_FINDING: ${{ inputs.second_dependent_review_finding }}
          SOURCE_BUNDLE_JSON: ${{ inputs.source_bundle_json }}
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          : "${QUEUE_ID:=}"
          : "${REPLACE_RULESPEC_PATH:=}"
          : "${REPLACE_LEGACY_RULESPEC_PATH:=}"
          : "${LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:=}"
          : "${SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:=}"
          : "${SECOND_DEPENDENT_CITATION:=}"
          : "${SECOND_DEPENDENT_REVIEW_FINDING:=}"
          dependent_rulespec_path=""
          second_dependent_rulespec_path=""

          run_signed_encode() {
            local citation="$1"
            local review_finding="$2"
            local target_only="$3"
            local output_lane="$4"
            local replacement_path="$5"
            local legacy_source_path="$6"
            local require_source_bundle_imports="$7"
            local review_finding_path=""
            local -a args=(
              /opt/axiom-verification/axiom-encode encode
              --backend openai
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus"
              --axiom-rules-engine-path "$GITHUB_WORKSPACE/axiom-rules-engine"
              --policy-repo-path "$RULESPEC_CHECKOUT"
              --output "$RUNNER_TEMP/generated/$output_lane"
              --mode repo-augmented
              --db "$RUNNER_TEMP/encodings.db"
              --no-sync
              --apply
            )
            if [ "$target_only" = "true" ]; then
              args+=(--apply-target-only)
            fi
            if [ -n "$replacement_path" ]; then
              args+=(--replace-rulespec-path "$replacement_path")
            fi
            if [ -n "$legacy_source_path" ]; then
              args+=(--replace-legacy-rulespec-path "$legacy_source_path")
              if [ -n "$dependent_rulespec_path" ]; then
                args+=(
                  --legacy-dependent-rulespec-path "$dependent_rulespec_path"
                )
              fi
              if [ -n "$second_dependent_rulespec_path" ]; then
                args+=(
                  --legacy-dependent-rulespec-path \
                  "$second_dependent_rulespec_path"
                )
              fi
              if [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
                args+=(
                  --legacy-exact-dependent-rulespec-path \
                  "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                )
              fi
              if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
                args+=(
                  --legacy-exact-dependent-rulespec-path \
                  "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                )
              fi
            fi
            if [ "$require_source_bundle_imports" = "true" ]; then
              while IFS= read -r required_import_path; do
                args+=(--required-import-rulespec-path "$required_import_path")
              done < "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
            fi
            if [ -n "$review_finding" ]; then
              review_finding_dir="$(mktemp -d "$RUNNER_TEMP/axiom-targeted-review-finding.XXXXXX")"
              review_finding_path="$review_finding_dir/review-finding.txt"
              printf '%s\n' "$review_finding" > "$review_finding_path"
              args+=(--review-findings "$review_finding_path")
            fi
            args+=("$citation")

            /opt/axiom-verification/axiom-encode-apply-signer run \
              --scope apply_ed25519 \
              --key-env AXIOM_ENCODE_APPLY_SIGNING_KEY \
              --supervisor /opt/axiom-verification/axiom-encode-signing-supervisor \
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
              --trusted-python-runtime-root /opt/axiom-verification/python \
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
              --expected-github-repository TheAxiomFoundation/axiom-encode \
              --allowed-workflow-ref TheAxiomFoundation/axiom-encode/.github/workflows/targeted-signed-reencode.yml@refs/heads/main \
              --allowed-event-name workflow_dispatch \
              -- "${args[@]}"
          }

          if [ -n "$DEPENDENT_REVIEW_FINDING" ] && [ -z "$DEPENDENT_CITATION" ]; then
            echo "dependent citation is required with dependent review finding" >&2
            exit 1
          fi
          if [ -n "$QUEUE_ID" ] && \
            { [ -n "$REPLACE_RULESPEC_PATH" ] || \
              [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
              [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
              [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; }; then
            echo "queue-authorized re-encodes cannot override the RuleSpec target path" >&2
            exit 1
          fi
          if [ -n "$REPLACE_LEGACY_RULESPEC_PATH" ] && \
            [ -z "$REPLACE_RULESPEC_PATH" ]; then
            echo "legacy source and canonical destination must be paired" >&2
            exit 1
          fi
          if { [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; } && \
             [ -z "$REPLACE_LEGACY_RULESPEC_PATH" ]; then
            echo "exact legacy dependents require a legacy source replacement" >&2
            exit 1
          fi
          if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             [ -z "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; then
            echo "first exact legacy dependent is required before a second" >&2
            exit 1
          fi
          if { [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] || \
               [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; } && \
             { [ -n "$DEPENDENT_CITATION" ] || \
               [ -n "$SECOND_DEPENDENT_CITATION" ]; }; then
            echo "exact and model-regenerated dependent modes cannot be combined" >&2
            exit 1
          fi
          if [ -n "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             { [ "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_RULESPEC_PATH" ] || \
               [ "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_LEGACY_RULESPEC_PATH" ]; }; then
            echo "exact legacy dependent must differ from source and destination" >&2
            exit 1
          fi
          if [ -n "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ] && \
             { [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_RULESPEC_PATH" ] || \
               [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$REPLACE_LEGACY_RULESPEC_PATH" ] || \
               [ "$SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" = "$LEGACY_EXACT_DEPENDENT_RULESPEC_PATH" ]; }; then
            echo "second exact legacy dependent must be unique" >&2
            exit 1
          fi
          if [ -n "$DEPENDENT_CITATION" ] && [ -z "$DEPENDENT_REVIEW_FINDING" ]; then
            echo "dependent review finding is required with dependent citation" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && [ -z "$DEPENDENT_CITATION" ]; then
            echo "first dependent citation is required before a second dependent" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_REVIEW_FINDING" ] && \
            [ -z "$SECOND_DEPENDENT_CITATION" ]; then
            echo "second dependent citation is required with its review finding" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && \
            [ -z "$SECOND_DEPENDENT_REVIEW_FINDING" ]; then
            echo "second dependent review finding is required" >&2
            exit 1
          fi
          if [ -n "$DEPENDENT_CITATION" ] && [ "$DEPENDENT_CITATION" = "$CITATION" ]; then
            echo "dependent citation must differ from the target citation" >&2
            exit 1
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ] && \
            { [ "$SECOND_DEPENDENT_CITATION" = "$CITATION" ] || \
              [ "$SECOND_DEPENDENT_CITATION" = "$DEPENDENT_CITATION" ]; }; then
            echo "second dependent citation must be unique" >&2
            exit 1
          fi

          backfill_helper="axiom-encode/scripts/prepare_signed_backfill.py"
          if [ ! -f "$backfill_helper" ]; then
            backfill_helper="scripts/prepare_signed_backfill.py"
          fi
          workflow_python="/opt/axiom-verification/python/bin/python"
          if [ ! -x "$workflow_python" ]; then
            workflow_python="${AXIOM_TEST_PYTHON:-python}"
          fi
          if [ -n "$DEPENDENT_CITATION" ]; then
            dependent_rulespec_path="$("$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$DEPENDENT_CITATION")"
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            second_dependent_rulespec_path="$("$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$SECOND_DEPENDENT_CITATION")"
          fi

          source_bundle_args=(
            "$workflow_python" "$backfill_helper" parse-source-bundle
            "${SOURCE_BUNDLE_JSON:-[]}" --primary-citation "$CITATION"
          )
          if [ -n "$DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$DEPENDENT_CITATION")
          fi
          if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
            source_bundle_args+=(--exclude-citation "$SECOND_DEPENDENT_CITATION")
          fi
          normalized_source_bundle="$("${source_bundle_args[@]}")"
          if [ -n "$QUEUE_ID" ] && [ "$normalized_source_bundle" != "[]" ]; then
            echo "queue-authorized re-encodes cannot add a source bundle until queue generation identity binds it" >&2
            exit 1
          fi
          printf '%s\n' "$normalized_source_bundle" \
            > "$RUNNER_TEMP/source-bundle.json"
          jq -r '.[]' "$RUNNER_TEMP/source-bundle.json" \
            > "$RUNNER_TEMP/source-bundle-citations.txt"
          : > "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
          while IFS= read -r source_citation; do
            "$workflow_python" "$backfill_helper" \
              citation-rulespec-path "$source_citation" \
              >> "$RUNNER_TEMP/source-bundle-rulespec-paths.txt"
          done < "$RUNNER_TEMP/source-bundle-citations.txt"
          source_bundle_count="$(jq -er 'length' \
            "$RUNNER_TEMP/source-bundle.json")"
          source_bundle_enabled=false
          if [ "$source_bundle_count" -gt 0 ]; then
            source_bundle_enabled=true
          fi

          checkpoint_signed_changes() {
            local message="$1"
            /opt/axiom-verification/axiom-encode-signing-supervisor \
              --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
              --trusted-python-runtime-root /opt/axiom-verification/python \
              --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
              --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
              -- /opt/axiom-verification/axiom-encode guard-generated \
              --repo "$RULESPEC_CHECKOUT" \
              --corpus-path "$GITHUB_WORKSPACE/axiom-corpus" \
              --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode" \
              --json > "$RUNNER_TEMP/checkpoint-guard-generated.json"
            git -C "$RULESPEC_CHECKOUT" diff --check
            "$workflow_python" "$backfill_helper" stage "$RULESPEC_CHECKOUT"
            git -C "$RULESPEC_CHECKOUT" \
              -c core.hooksPath=/dev/null \
              -c user.name=axiom-encode-bot \
              -c user.email=axiom-encode-bot@users.noreply.github.com \
              commit -m "$message"
          }

          source_index=0
          while IFS= read -r source_citation; do
            source_index=$((source_index + 1))
            source_lane="$(printf 'source-%02d' "$source_index")"
            run_signed_encode \
              "$source_citation" "" true "$source_lane" "" "" false
            checkpoint_signed_changes \
              "Add signed source module for ${source_citation}"
            cp "$RUNNER_TEMP/checkpoint-guard-generated.json" \
              "$RUNNER_TEMP/${source_lane}-guard-generated.json"
          done < "$RUNNER_TEMP/source-bundle-citations.txt"

          if [ -n "$DEPENDENT_CITATION" ]; then
            run_signed_encode \
              "$CITATION" "$REVIEW_FINDING" true target \
              "$REPLACE_RULESPEC_PATH" "$REPLACE_LEGACY_RULESPEC_PATH" \
              "$source_bundle_enabled"
            dependent_target_only=false
            if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
              dependent_target_only=true
            fi
            run_signed_encode \
              "$DEPENDENT_CITATION" "$DEPENDENT_REVIEW_FINDING" \
              "$dependent_target_only" dependent "" "" false
            if [ -n "$SECOND_DEPENDENT_CITATION" ]; then
              run_signed_encode \
                "$SECOND_DEPENDENT_CITATION" \
                "$SECOND_DEPENDENT_REVIEW_FINDING" false dependent-2 "" "" false
            fi
          else
            run_signed_encode \
              "$CITATION" "$REVIEW_FINDING" false \
              target "$REPLACE_RULESPEC_PATH" \
              "$REPLACE_LEGACY_RULESPEC_PATH" \
              "$source_bundle_enabled"
          fi

          if [ "$source_bundle_enabled" = "true" ]; then
            checkpoint_signed_changes \
              "Compose signed source bundle for ${CITATION}"
          fi

      - name: Verify generated provenance
        env:
          RULESPEC_CHECKOUT: ${{ github.workspace }}/rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          guard_ref_args=()
          if jq -e 'length > 0' "$RUNNER_TEMP/source-bundle.json" > /dev/null; then
            guard_ref_args+=(--base-ref "$RULESPEC_REF")
          fi
          /opt/axiom-verification/axiom-encode-signing-supervisor \
            --trusted-signing-roots /opt/axiom-verification/signing-trust-roots.json \
            --trusted-python-runtime-root /opt/axiom-verification/python \
            --trusted-python-import-root /opt/axiom-verification/python/lib/python3.13/site-packages \
            --trusted-python-package-root /opt/axiom-verification/python/lib/python3.13/site-packages/axiom_encode \
            -- /opt/axiom-verification/axiom-encode guard-generated \
            --repo "$RULESPEC_CHECKOUT" \
            --corpus-path "$GITHUB_WORKSPACE/axiom-corpus" \
            --expected-encoder-checkout "$GITHUB_WORKSPACE/axiom-encode" \
            "${guard_ref_args[@]}" \
            --json > "$RUNNER_TEMP/guard-generated.json"
          git -C "$RULESPEC_CHECKOUT" diff --check

      - name: Package exact generated changes
        env:
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          DEPENDENT_REVIEW_FINDING_PRESENT: ${{ inputs.dependent_review_finding != '' }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          SECOND_DEPENDENT_REVIEW_FINDING_PRESENT: ${{ inputs.second_dependent_review_finding != '' }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          REVIEW_FINDING_PRESENT: ${{ inputs.review_finding != '' }}
          REPLACE_RULESPEC_PATH: ${{ inputs.replace_rulespec_path }}
          REPLACE_LEGACY_RULESPEC_PATH: ${{ inputs.replace_legacy_rulespec_path }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
        run: |
          set -euo pipefail
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          artifact="$RUNNER_TEMP/targeted-reencode"
          mkdir -p "$artifact"
          git -C "$RULESPEC_CHECKOUT" diff --binary --full-index \
            "$RULESPEC_REF" > "$artifact/tracked.patch"
          git -C "$RULESPEC_CHECKOUT" ls-files --others --exclude-standard -z \
            | tar -C "$RULESPEC_CHECKOUT" --null -czf "$artifact/untracked.tar.gz" --files-from -
          git -C "$RULESPEC_CHECKOUT" status --short > "$artifact/status.txt"
          git -C "$RULESPEC_CHECKOUT" diff --name-status \
            "$RULESPEC_REF" HEAD >> "$artifact/status.txt"
          cp "$RUNNER_TEMP/guard-generated.json" "$artifact/guard-generated.json"
          cp "$RUNNER_TEMP/source-bundle.json" "$artifact/source-bundle.json"
          for source_guard in "$RUNNER_TEMP"/source-*-guard-generated.json; do
            if [ -f "$source_guard" ]; then
              cp "$source_guard" "$artifact/"
            fi
          done
          "${workflow_python[@]}" - \
            "$artifact/context-manifest.json" \
            "$artifact/apply-manifests.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          from axiom_encode.corpus_resolver import (
              UnsafeCorpusPathError,
              read_bounded_regular_file,
          )

          def git_paths(*args):
              output = subprocess.check_output(
                  ["git", "-C", os.environ["RULESPEC_CHECKOUT"], *args]
              )
              return {
                  Path(value.decode("utf-8"))
                  for value in output.split(b"\0")
                  if value
              }

          def read_bounded_regular(root, relative, *, label, max_bytes):
              relative = Path(relative)
              if (
                  relative.is_absolute()
                  or not relative.parts
                  or any(part in {"", ".", ".."} for part in relative.parts)
              ):
                  raise SystemExit(f"{label} path is not canonical")
              root = Path(root).resolve(strict=True)
              try:
                  return read_bounded_regular_file(
                      root,
                      root / relative,
                      label=label,
                      max_bytes=max_bytes,
                      required_mode=0o644,
                  )
              except UnsafeCorpusPathError as exc:
                  raise SystemExit(str(exc)) from exc

          manifest_paths = git_paths(
              "diff", "--name-only", "--diff-filter=AM", "-z",
              os.environ["RULESPEC_REF"], "--",
              ".axiom/encoding-manifests",
          )
          deleted_manifest_paths = git_paths(
              "diff", "--name-only", "--diff-filter=D", "-z",
              os.environ["RULESPEC_REF"], "--",
              ".axiom/encoding-manifests",
          )
          manifest_paths.update(
              git_paths(
                  "ls-files", "--others", "--exclude-standard", "-z", "--",
                  ".axiom/encoding-manifests",
              )
          )
          dependent_citation = os.environ.get("DEPENDENT_CITATION") or ""
          second_dependent_citation = (
              os.environ.get("SECOND_DEPENDENT_CITATION") or ""
          )
          replacement_path = os.environ.get("REPLACE_RULESPEC_PATH") or ""
          legacy_source_path = (
              os.environ.get("REPLACE_LEGACY_RULESPEC_PATH") or ""
          )
          exact_dependent_paths = [
              value
              for value in (
                  os.environ.get("LEGACY_EXACT_DEPENDENT_RULESPEC_PATH") or "",
                  os.environ.get(
                      "SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                  ) or "",
              )
              if value
          ]
          normalized_replacement_path = ""
          if replacement_path:
              candidate = Path(replacement_path)
              if (
                  candidate.is_absolute()
                  or candidate.as_posix() != replacement_path
                  or any(part in {"", ".", ".."} for part in candidate.parts)
              ):
                  raise SystemExit(
                      "replacement RuleSpec path is not canonical checkout-relative"
                  )
              normalized_replacement_path = candidate.as_posix()
          expected_citations = {os.environ["CITATION"]}
          source_bundle_path = Path(os.environ["RUNNER_TEMP"]) / "source-bundle.json"
          source_bundle_citations = json.loads(source_bundle_path.read_text())
          if not isinstance(source_bundle_citations, list) or not all(
              isinstance(item, str) and item for item in source_bundle_citations
          ):
              raise SystemExit("normalized source bundle is malformed")
          expected_citations.update(source_bundle_citations)
          if dependent_citation:
              expected_citations.add(dependent_citation)
          if second_dependent_citation:
              expected_citations.add(second_dependent_citation)

          matches = {}
          for relative_path in sorted(manifest_paths):
              payload = json.loads(
                  read_bounded_regular(
                      os.environ["RULESPEC_CHECKOUT"],
                      relative_path,
                      label="changed apply manifest",
                      max_bytes=1024 * 1024,
                  ).decode("utf-8")
              )
              effective = payload
              if (
                  payload.get("tool")
                  == "axiom-encode encode --apply --replace-legacy-rulespec-path"
              ):
                  effective = payload.get("replacement_manifest")
                  if not isinstance(effective, dict):
                      raise SystemExit(
                          "legacy replacement omits nested model manifest"
                      )
              citation = effective.get("citation")
              if (
                  payload.get("schema_version")
                  == "axiom-encode/applied-rulespec/v5"
                  and citation in expected_citations
              ):
                  matches.setdefault(citation, []).append(
                      (relative_path, payload, effective)
                  )

          expected = [
              (
                  os.environ["CITATION"],
                  os.environ["REVIEW_FINDING_PRESENT"] == "true",
                  Path(sys.argv[1]),
                  "target",
              )
          ]
          for source_index, source_citation in enumerate(
              source_bundle_citations, start=1
          ):
              source_lane = f"source-{source_index:02d}"
              expected.append(
                  (
                      source_citation,
                      False,
                      Path(sys.argv[1]).with_name(
                          f"{source_lane}-context-manifest.json"
                      ),
                      source_lane,
                  )
              )
          if dependent_citation:
              expected.append(
                  (
                      dependent_citation,
                      os.environ["DEPENDENT_REVIEW_FINDING_PRESENT"] == "true",
                      Path(sys.argv[1]).with_name("dependent-context-manifest.json"),
                      "dependent",
                  )
              )
          if second_dependent_citation:
              expected.append(
                  (
                      second_dependent_citation,
                      (
                          os.environ["SECOND_DEPENDENT_REVIEW_FINDING_PRESENT"]
                          == "true"
                      ),
                      Path(sys.argv[1]).with_name(
                          "dependent-2-context-manifest.json"
                      ),
                      "dependent-2",
                  )
              )

          generated_root = (Path(os.environ["RUNNER_TEMP"]) / "generated").resolve()
          applied_inventory = []
          for citation, finding_required, destination, lane in expected:
              citation_matches = matches.get(citation, [])
              if len(citation_matches) != 1:
                  raise SystemExit(
                      "expected exactly one changed signed apply manifest for "
                      f"{citation}; found {len(citation_matches)}"
                  )
              relative_path, applied_manifest, evidence_manifest = (
                  citation_matches[0]
              )
              manifest_path = Path(os.environ["RULESPEC_CHECKOUT"]) / relative_path
              if lane == "target" and legacy_source_path:
                  if (
                      applied_manifest.get("tool")
                      != "axiom-encode encode --apply "
                      "--replace-legacy-rulespec-path"
                  ):
                      raise SystemExit(
                          "legacy replacement target is not the dedicated v5 contract"
                      )
                  replacement = applied_manifest.get("replacement")
                  if not isinstance(replacement, dict):
                      raise SystemExit("legacy replacement binding is malformed")
                  receipt_path_raw = replacement.get("receipt_path")
                  if not isinstance(receipt_path_raw, str):
                      raise SystemExit("legacy replacement receipt path is malformed")
                  receipt_path = Path(receipt_path_raw)
                  if (
                      receipt_path.is_absolute()
                      or receipt_path.as_posix() != receipt_path_raw
                      or any(part in {"", ".", ".."} for part in receipt_path.parts)
                      or receipt_path.parent
                      != Path(".axiom/legacy-replacements")
                      or receipt_path.suffix != ".json"
                      or re.fullmatch(r"[0-9a-f]{64}", receipt_path.stem) is None
                  ):
                      raise SystemExit(
                          "legacy replacement receipt path is not canonical"
                      )
                  receipt_bytes = read_bounded_regular(
                      os.environ["RULESPEC_CHECKOUT"],
                      receipt_path,
                      label="legacy replacement receipt",
                      max_bytes=4 * 1024 * 1024,
                  )
                  if (
                      hashlib.sha256(receipt_bytes).hexdigest()
                      != replacement.get("receipt_sha256")
                  ):
                      raise SystemExit(
                          "legacy replacement receipt digest does not match"
                      )
                  receipt = json.loads(receipt_bytes)
                  receipt_replacement = receipt.get("replacement")
                  receipt_schema = receipt.get("schema_version")
                  if (
                      receipt_schema not in {
                          "axiom-encode/legacy-fresh-reencode-receipt/v1",
                          "axiom-encode/legacy-fresh-reencode-receipt/v2",
                      }
                      or not isinstance(receipt_replacement, dict)
                      or receipt_replacement.get("source")
                      != legacy_source_path
                      or receipt_replacement.get("destination")
                      != normalized_replacement_path
                  ):
                      raise SystemExit("legacy replacement receipt paths differ")
                  exact_dependents = receipt_replacement.get(
                      "exact_dependents",
                      [],
                  )
                  if (
                      not isinstance(exact_dependents, list)
                      or [
                          item.get("primary")
                          for item in exact_dependents
                          if isinstance(item, dict)
                      ]
                      != exact_dependent_paths
                      or (
                          exact_dependent_paths
                          and receipt_schema
                          != "axiom-encode/legacy-fresh-reencode-receipt/v2"
                      )
                  ):
                      raise SystemExit(
                          "legacy replacement exact dependents differ from inputs"
                      )
                  receipt_sha256 = hashlib.sha256(receipt_bytes).hexdigest()
                  for exact_dependent in exact_dependents:
                      primary = exact_dependent.get("primary")
                      if not isinstance(primary, str):
                          raise SystemExit(
                              "legacy replacement exact dependent is malformed"
                          )
                      exact_manifest_path = (
                          Path(".axiom/encoding-manifests")
                          / Path(primary).with_suffix(".json")
                      )
                      if exact_manifest_path not in manifest_paths:
                          raise SystemExit(
                              "legacy replacement exact dependent lacks "
                              "a changed signed manifest"
                          )
                      exact_manifest_bytes = read_bounded_regular(
                          os.environ["RULESPEC_CHECKOUT"],
                          exact_manifest_path,
                          label="legacy exact dependent manifest",
                          max_bytes=1024 * 1024,
                      )
                      exact_manifest = json.loads(exact_manifest_bytes)
                      migration = exact_manifest.get("legacy_migration")
                      if (
                          exact_manifest.get("tool")
                          != "axiom-encode encode --apply "
                          "--legacy-exact-dependent-rulespec-path"
                          or not isinstance(migration, dict)
                          or migration.get("receipt_path")
                          != receipt_path.as_posix()
                          or migration.get("receipt_sha256") != receipt_sha256
                          or migration.get("primary") != primary
                          or exact_manifest.get("applied_files")
                          != exact_dependent.get("live_files")
                      ):
                          raise SystemExit(
                              "legacy exact dependent manifest binding differs"
                          )
                      applied_inventory.append(
                          {
                              "citation": None,
                              "path": exact_manifest_path.as_posix(),
                              "sha256": hashlib.sha256(
                                  exact_manifest_bytes
                              ).hexdigest(),
                          }
                      )
                  scheduled = receipt_replacement.get("scheduled_dependents")
                  if not isinstance(scheduled, list):
                      raise SystemExit(
                          "legacy replacement scheduled dependents are malformed"
                      )
                  from axiom_encode.rulespec_path_migration import (
                      rewrite_exact_references,
                  )
                  for dependent in scheduled:
                      if (
                          not isinstance(dependent, dict)
                          or not isinstance(dependent.get("primary"), str)
                          or not isinstance(dependent.get("files"), list)
                      ):
                          raise SystemExit(
                              "legacy replacement scheduled dependent is malformed"
                          )
                      dependent_manifest = (
                          Path(".axiom/encoding-manifests")
                          / Path(dependent["primary"]).with_suffix(".json")
                      )
                      if dependent_manifest not in manifest_paths:
                          raise SystemExit(
                              "legacy replacement scheduled dependent lacks "
                              "a changed signed manifest"
                          )
                      for evidence in dependent["files"]:
                          if not isinstance(evidence, dict):
                              raise SystemExit(
                                  "legacy replacement scheduled file is malformed"
                              )
                          pending_relative = Path(
                              str(evidence.get("path") or "")
                          )
                          pending_bytes = read_bounded_regular(
                              os.environ["RULESPEC_CHECKOUT"],
                              pending_relative,
                              label="legacy replacement scheduled dependent",
                              max_bytes=16 * 1024 * 1024,
                          )
                          if (
                              hashlib.sha256(pending_bytes).hexdigest()
                              == evidence.get("before_sha256")
                          ):
                              raise SystemExit(
                                  "legacy replacement scheduled dependent "
                                  "is still pending"
                              )
                          replacements = {
                              str(item["from"]): str(item["to"])
                              for item in evidence.get("replacements", [])
                              if isinstance(item, dict)
                              and set(item) == {"from", "to", "count"}
                          }
                          _rewritten, remaining = rewrite_exact_references(
                              pending_bytes, replacements
                          )
                          if (
                              len(replacements)
                              != len(evidence.get("replacements", []))
                              or remaining
                          ):
                              raise SystemExit(
                                  "legacy replacement scheduled dependent "
                                  "retains an old reference"
                              )
                  expected_old_manifest = Path(
                      ".axiom/encoding-manifests"
                  ) / Path(legacy_source_path).with_suffix(".json")
                  if legacy_source_path == normalized_replacement_path:
                      if deleted_manifest_paths:
                          raise SystemExit(
                              "in-place legacy replacement must overwrite, not "
                              "delete, its ownership manifest"
                          )
                      if expected_old_manifest != relative_path:
                          raise SystemExit(
                              "in-place legacy replacement manifest path differs"
                          )
                      live_primary = (
                          Path(os.environ["RULESPEC_CHECKOUT"])
                          / normalized_replacement_path
                      )
                      if not live_primary.is_file():
                          raise SystemExit(
                              "in-place legacy replacement primary is absent"
                          )
                  else:
                      if deleted_manifest_paths != {expected_old_manifest}:
                          raise SystemExit(
                              "legacy replacement must delete exactly its old manifest"
                          )
                      if (
                          Path(os.environ["RULESPEC_CHECKOUT"]) / legacy_source_path
                      ).exists():
                          raise SystemExit(
                              "legacy replacement old primary still exists"
                          )
                  receipt_artifact = Path(sys.argv[1]).with_name(
                      "legacy-replacement-receipt.json"
                  )
                  receipt_artifact.write_bytes(receipt_bytes)
              elif lane == "target" and normalized_replacement_path:
                  applied_files = applied_manifest.get("applied_files")
                  if not isinstance(applied_files, list):
                      raise SystemExit(
                          "replacement apply manifest has malformed applied_files"
                      )
                  primary_paths = sorted(
                      item.get("path")
                      for item in applied_files
                      if isinstance(item, dict)
                      and isinstance(item.get("path"), str)
                      and item["path"].endswith(".yaml")
                      and not item["path"].endswith(".test.yaml")
                  )
                  if primary_paths != [normalized_replacement_path]:
                      raise SystemExit(
                          "replacement apply manifest primary path does not "
                          "match the requested RuleSpec target"
                      )
              context_path = Path(
                  evidence_manifest["context_manifest_file"]
              ).resolve()
              try:
                  context_path.relative_to(generated_root / lane)
              except ValueError as exc:
                  raise SystemExit(
                      f"signed context manifest is outside assigned {lane} lane"
                  ) from exc
              context_bytes = read_bounded_regular(
                  generated_root,
                  context_path.relative_to(generated_root),
                  label="signed context manifest",
                  max_bytes=16 * 1024 * 1024,
              )
              context_digest = hashlib.sha256(context_bytes).hexdigest()
              if context_digest != evidence_manifest.get(
                  "context_manifest_sha256"
              ):
                  raise SystemExit("signed context manifest digest does not match")

              context_payload = json.loads(context_bytes)
              if context_payload.get("citation") != citation:
                  raise SystemExit(
                      "signed context manifest citation does not match"
                  )
              review_findings = context_payload.get("review_findings_files")
              if not isinstance(review_findings, list):
                  raise SystemExit(
                      "context manifest review findings evidence is malformed"
                  )
              if finding_required and not review_findings:
                  raise SystemExit("context manifest omits supplied review finding")
              for finding in review_findings:
                  if not isinstance(finding, dict):
                      raise SystemExit("context manifest review finding is malformed")
                  content = finding.get("content")
                  digest = finding.get("sha256")
                  if not isinstance(content, str) or not content.strip():
                      raise SystemExit(
                          "context manifest review finding content is empty"
                      )
                  if "\r" in content:
                      raise SystemExit(
                          "context manifest review finding is not normalized"
                      )
                  if hashlib.sha256(content.encode("utf-8")).hexdigest() != digest:
                      raise SystemExit(
                          "context manifest review finding digest does not match"
                      )

              destination.write_bytes(context_bytes)
              applied_inventory.append(
                  {
                      "citation": citation,
                      "path": relative_path.as_posix(),
                      "sha256": hashlib.sha256(
                          read_bounded_regular(
                              os.environ["RULESPEC_CHECKOUT"],
                              relative_path,
                              label="packaged apply manifest",
                              max_bytes=1024 * 1024,
                          )
                      ).hexdigest(),
                  }
              )
          Path(sys.argv[2]).write_text(
              json.dumps(
                  {
                      "schema": "axiom-encode/applied-manifest-inventory/v1",
                      "items": applied_inventory,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          "${workflow_python[@]}" - "$artifact/metadata.json" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          def rev(path):
              return subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()

          payload = {
              "schema": "axiom-encode/targeted-reencode-artifact/v1",
              "citation": os.environ["CITATION"],
              "source_bundle": json.loads(
                  (
                      Path(os.environ["RUNNER_TEMP"]) / "source-bundle.json"
                  ).read_text(encoding="utf-8")
              ),
              "dependent_citation": os.environ.get("DEPENDENT_CITATION") or None,
              "second_dependent_citation": (
                  os.environ.get("SECOND_DEPENDENT_CITATION") or None
              ),
              "replace_rulespec_path": (
                  os.environ.get("REPLACE_RULESPEC_PATH") or None
              ),
              "replace_legacy_rulespec_path": (
                  os.environ.get("REPLACE_LEGACY_RULESPEC_PATH") or None
              ),
              "legacy_exact_dependent_rulespec_path": (
                  os.environ.get("LEGACY_EXACT_DEPENDENT_RULESPEC_PATH") or None
              ),
              "second_legacy_exact_dependent_rulespec_path": (
                  os.environ.get(
                      "SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH"
                  ) or None
              ),
              "pr_base_branch": os.environ["PR_BASE_BRANCH"],
              "queue_id": os.environ.get("QUEUE_ID") or None,
              "queue_item_id": os.environ.get("QUEUE_ITEM_ID") or None,
              "queue_item_generation_sha256": (
                  os.environ.get("QUEUE_ITEM_GENERATION_SHA256") or None
              ),
              "queue_manifest_sha256": (
                  os.environ.get("QUEUE_MANIFEST_SHA256") or None
              ),
              "rulespec_base": os.environ["RULESPEC_REF"],
              "rulespec_generated_head": rev(os.environ["RULESPEC_CHECKOUT"]),
              "encoder_commit": rev("axiom-encode"),
              "corpus_commit": rev("axiom-corpus"),
              "rules_engine_commit": rev("axiom-rules-engine"),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          test -s "$artifact/status.txt"

      - name: Commit reviewed lane changes locally
        if: ${{ inputs.open_pr }}
        env:
          COUNTRY: ${{ inputs.country }}
          CITATION: ${{ inputs.citation }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          branch="$("${workflow_python[@]}" \
            axiom-encode/scripts/prepare_signed_backfill.py branch-name \
            "$COUNTRY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          git -C "$RULESPEC_CHECKOUT" switch -c "$branch"
          if jq -e 'length > 0' \
            "$RUNNER_TEMP/source-bundle.json" > /dev/null; then
            test -z "$(git -C "$RULESPEC_CHECKOUT" status --porcelain)"
          else
            "${workflow_python[@]}" \
              axiom-encode/scripts/prepare_signed_backfill.py stage \
              "$RULESPEC_CHECKOUT"
            git -C "$RULESPEC_CHECKOUT" \
              -c core.hooksPath=/dev/null \
              -c user.name=axiom-encode-bot \
              -c user.email=axiom-encode-bot@users.noreply.github.com \
              commit -m "Add signed encoding manifest for ${CITATION}"
          fi

      - name: Push lane branch and open draft pull request
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ secrets.AXIOM_REPO_TOKEN }}
          COUNTRY: ${{ inputs.country }}
          CITATION: ${{ inputs.citation }}
          DEPENDENT_CITATION: ${{ inputs.dependent_citation }}
          SECOND_DEPENDENT_CITATION: ${{ inputs.second_dependent_citation }}
          LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.legacy_exact_dependent_rulespec_path }}
          SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH: ${{ inputs.second_legacy_exact_dependent_rulespec_path }}
          RULESPEC_REF: ${{ inputs.rulespec_ref }}
          PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
          QUEUE_ID: ${{ inputs.queue_id }}
          QUEUE_ITEM_ID: ${{ inputs.queue_item_id }}
          QUEUE_ITEM_GENERATION_SHA256: ${{ inputs.queue_item_generation_sha256 }}
          QUEUE_MANIFEST_SHA256: ${{ inputs.queue_manifest_sha256 }}
          RULESPEC_CHECKOUT: rulespec-${{ inputs.country }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          workflow_python=(/opt/axiom-verification/python/bin/python -I)
          if [ ! -x "${workflow_python[0]}" ]; then
            workflow_python=("${AXIOM_TEST_PYTHON:-python}")
          fi
          repo="TheAxiomFoundation/rulespec-${COUNTRY}"
          git -C "$RULESPEC_CHECKOUT" fetch --no-tags origin \
            "+refs/heads/${PR_BASE_BRANCH}:refs/remotes/origin/${PR_BASE_BRANCH}"
          test "$(git -C "$RULESPEC_CHECKOUT" rev-parse \
            "refs/remotes/origin/${PR_BASE_BRANCH}")" = "$RULESPEC_REF"
          branch="$("${workflow_python[@]}" \
            axiom-encode/scripts/prepare_signed_backfill.py branch-name \
            "$COUNTRY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          source_bundle="$(tr -d '\n' < "$RUNNER_TEMP/source-bundle.json")"
          body="$(printf '%s\n' \
            '## Signed apply manifest' \
            '' \
            "Citation: \`${CITATION}\`" \
            "Atomic source bundle: \`${source_bundle}\`" \
            "Direct dependent: \`${DEPENDENT_CITATION:-n/a}\`" \
            "Second direct dependent: \`${SECOND_DEPENDENT_CITATION:-n/a}\`" \
            "Exact legacy dependent: \`${LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:-n/a}\`" \
            "Second exact legacy dependent: \`${SECOND_LEGACY_EXACT_DEPENDENT_RULESPEC_PATH:-n/a}\`" \
            "Base commit: \`${RULESPEC_REF}\`" \
            "Base branch: \`${PR_BASE_BRANCH}\`" \
            "Queue item: \`${QUEUE_ID:-ad-hoc}/${QUEUE_ITEM_ID:-ad-hoc}\`" \
            "Queue generation SHA-256: \`${QUEUE_ITEM_GENERATION_SHA256:-n/a}\`" \
            "Queue manifest SHA-256: \`${QUEUE_MANIFEST_SHA256:-n/a}\`" \
            "Axiom Encode run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            'This draft PR was produced by the protected country-general signed-apply workflow. Review all RuleSpec and manifest changes before marking it ready.')"
          gh auth setup-git
          git -C "$RULESPEC_CHECKOUT" -c core.hooksPath=/dev/null push \
            "https://github.com/${repo}.git" "HEAD:refs/heads/${branch}"
          gh api --method POST "repos/${repo}/pulls" \
            -f title="Add signed encoding manifest for ${CITATION}" \
            -f head="TheAxiomFoundation:${branch}" \
            -f base="$PR_BASE_BRANCH" \
            -f body="$body" \
            -F draft=true > "$RUNNER_TEMP/lane-pull-request.json"
          if ! jq -e \
            --arg branch "$PR_BASE_BRANCH" \
            --arg sha "$RULESPEC_REF" \
            '.base.ref == $branch and .base.sha == $sha' \
            "$RUNNER_TEMP/lane-pull-request.json" > /dev/null; then
            pr_number="$(jq -r '.number // empty' \
              "$RUNNER_TEMP/lane-pull-request.json")"
            if test -n "$pr_number"; then
              gh api --method PATCH "repos/${repo}/pulls/${pr_number}" \
                -f state=closed || echo "warning: failed to close stale-base PR" >&2
            fi
            git -C "$RULESPEC_CHECKOUT" push \
              "https://github.com/${repo}.git" \
              ":refs/heads/${branch}" ||
              echo "warning: failed to delete stale-base lane branch" >&2
            echo "created pull request does not target the reviewed base SHA" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/lane-pull-request.json" \
            "$RUNNER_TEMP/targeted-reencode/lane-pull-request.json"

      - name: Finalize signed re-encode artifact checksums
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/targeted-reencode"
          (
            cd "$artifact"
            sha256sum * > SHA256SUMS
          )

      - name: Upload signed re-encode artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: targeted-reencode-${{ github.run_id }}
          path: ${{ runner.temp }}/targeted-reencode
          if-no-files-found: error
          retention-days: 90
